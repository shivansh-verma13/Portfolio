[build]
  base = "portfolio"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # EmailJS browser identifiers are public; never add a private API key here.
  VITE_EMAILJS_SERVICE_ID = "service_l1t91zo"
  VITE_EMAILJS_TEMPLATE_ID = "template_aolg40s"
  VITE_EMAILJS_PUBLIC_KEY = "uvYherv7v1bJuizLo"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
